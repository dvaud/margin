[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "margin"
version = "0.15.0"
description = "Margin: a research and paper-writing companion. Explore your documents, check what your draft claims against them, and check hypotheses, with Claude Code on your own plan or a local model and every quote verified (grown from ENLENS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "pypdf>=4.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# the app (margin-gui) needs nothing beyond the core: it is a standard-library server and a static page
gui = []
fast = ["numpy>=1.24"]                 # faster semantic search on large projects (pure Python otherwise)
anthropic = ["anthropic>=0.40"]        # the Claude API (cloud, opt-in)
connector = ["mcp>=2,<3"]
pdfminer = ["pdfminer.six>=20231228"]
ocr = ["pypdfium2>=4.20", "pillow>=10"]  # read scanned PDF pages; also needs the program tesseract (see the manual)
ci = ["pyyaml>=6", "ruff>=0.6"]          # 0.18.1 (J1.7): what only CI's every-extra job adds (the shape of the workflows, the lint); in uv.lock
dev = ["pytest>=8", "pytest-xdist>=3.5", "pytest-timeout>=2.3", "pytest-testmon>=2.1"]  # 2026-11-12: tests side by side (-n), a time limit per test; 2026-11-12: only the tests a change affects (--testmon)

[project.scripts]
margin = "margin.cli:main"
margin-gui = "margin.gui.launch:main"
margin-mcp = "margin.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
margin = ["data/*.csv", "data/*.md", "data/*.json", "data/*.txt", "data/codebooks/*", "gui/static/*", "gui/static/views/*", "gui/icons/*", "claude_plugin/*", "claude_plugin/agents/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 2026-11-12: a passing test's tmp_path is removed when it ends (it kept ~7 GB of leftovers after each full run)
tmp_path_retention_policy = "failed"
markers = [
    "heavy: writes hundreds of MB or runs for many seconds; left out of a local run of the whole suite (CI runs it)",
    "random: a seeded random run (2 seeds here, 10 in CI, 30 with MARGIN_LONG_RANDOM=1)",
    "durable: needs SQLite's real flushes and journal (the fast test settings are off for it)",
]
