[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "margin"
version = "0.12.1"
description = "Margin: a research and paper-writing companion. Explore your documents, check what your draft claims against them, and check hypotheses, with Claude Code on your own plan or a local model and every quote verified (grown from ENLENS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "pypdf>=4.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# the app (margin-gui) needs nothing beyond the core: it is a standard-library server and a static page
gui = []
fast = ["numpy>=1.24"]                 # faster semantic search on large projects (pure Python otherwise)
anthropic = ["anthropic>=0.40"]        # the Claude API (cloud, opt-in)
connector = ["mcp>=2,<3"]
pdfminer = ["pdfminer.six>=20231228"]
ocr = ["pypdfium2>=4.20", "pillow>=10"]  # read scanned PDF pages; also needs the program tesseract (see the manual)
dev = ["pytest>=8"]

[project.scripts]
margin = "margin.cli:main"
margin-gui = "margin.gui.launch:main"
margin-mcp = "margin.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
margin = ["data/*.csv", "data/*.md", "data/codebooks/*", "gui/static/*", "gui/static/views/*", "gui/icons/*", "claude_plugin/*", "claude_plugin/agents/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
